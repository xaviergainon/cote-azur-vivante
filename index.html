<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07161c" media="(prefers-color-scheme: dark)" />
    <title>Côte d'Azur Vivante — Agenda carte Alpes-Maritimes</title>
    <meta
      name="description"
      content="Carte, liste et calendrier des spectacles, festivals et sorties dans les Alpes-Maritimes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/map.css?v=15" />
  </head>
  <body data-view="map">
    <div id="map" aria-label="Carte des manifestations dans les Alpes-Maritimes"></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div id="mapError" class="map-error" hidden></div>

    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">06</div>
      <div class="search-pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Une pièce, un concert, un lieu…" autocomplete="off" enterkeyhint="search" aria-label="Rechercher" />
        <button type="button" class="filter-btn" id="filterBtn" aria-label="Ouvrir les filtres">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="badge-count" id="filterBadge" hidden>0</span>
        </button>
      </div>
    </header>

    <section class="datebar" aria-label="Quoi et quand">
      <div class="when">
        <strong id="whenLabel">7 prochains jours</strong>
        <span id="stats"></span>
        <button type="button" class="text-btn" id="daysToggle" aria-expanded="false">Jours</button>
      </div>
      <div class="span-row" id="spanRow" role="tablist" aria-label="Période"></div>
      <div class="intent-row" id="intentRow" role="tablist" aria-label="Envie"></div>
      <div class="timeline" id="dayRail" role="tablist" aria-label="Un jour" hidden></div>
      <div class="active-filters" id="activeFilters"></div>
    </section>

    <div class="map-actions">
      <button type="button" class="pill-btn" id="surpriseBtn">Surprends-moi</button>
      <button type="button" class="icon-btn" id="recenterBtn" aria-label="Recadrer la carte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <article class="ride" id="ride" hidden>
      <div class="ride-bar" aria-hidden="true"></div>
      <button type="button" class="ride-close" id="rideClose" aria-label="Fermer">×</button>
      <div id="rideBody"></div>
    </article>

    <section class="page" id="viewList" hidden>
      <div class="page-inner">
        <div class="page-tools">
          <p id="listStats"></p>
          <button type="button" class="pill-btn" id="exportList">Dans mon agenda</button>
        </div>
        <div class="list" id="list"></div>
      </div>
    </section>

    <section class="page" id="viewCal" hidden>
      <div class="page-inner cal-wrap">
        <div class="cal-nav">
          <button type="button" class="icon-btn" id="calPrev" aria-label="Mois précédent">‹</button>
          <h2 id="calTitle"></h2>
          <button type="button" class="icon-btn" id="calNext" aria-label="Mois suivant">›</button>
        </div>
        <div class="cal-weekdays" aria-hidden="true">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="page-tools">
          <p id="calStats"></p>
          <button type="button" class="pill-btn" id="exportCal">Dans mon agenda</button>
        </div>
        <div class="list" id="calEvents"></div>
      </div>
    </section>

    <nav class="tabbar" aria-label="Vues">
      <button type="button" data-view="map" class="on" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/></svg>
        Carte
      </button>
      <button type="button" data-view="list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h11M8 12h11M8 17h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4.5" cy="7" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17" r="1" fill="currentColor"/></svg>
        Liste
      </button>
      <button type="button" data-view="cal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4M16 3v4M4 10h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Calendrier
      </button>
    </nav>

    <div class="backdrop" id="sheetBackdrop" hidden></div>
    <section class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Filtres</h2>
        <button type="button" class="text-btn" id="closeSheet">Fermer</button>
      </div>
      <button type="button" class="toggle" id="freeToggle" aria-pressed="false">Gratuit seulement</button>
      <h3>Ville</h3>
      <div class="city-rail" id="cityRail"></div>
      <h3>Envie</h3>
      <div class="filters" id="filters"></div>
      <div class="sheet-actions">
        <button type="button" class="ghost-btn" id="resetFilters">Tout effacer</button>
        <button type="button" class="pill-btn" id="exportSheet">Dans mon agenda</button>
      </div>
      <p class="sheet-foot"><a href="/admin">Administration</a></p>
    </section>

    <div class="toast" id="toast" hidden></div>

    <div class="splash" id="splash">
      <div class="splash-inner">
        <div>
          <p class="splash-kicker">Côte d’Azur Vivante</p>
          <p class="splash-season" id="splashSeason">Alpes-Maritimes</p>
          <h1>À l’affiche</h1>
          <p class="splash-line">Théâtre, musique, danse, cinéma et expositions.</p>
        </div>
        <div class="splash-foot">
          <div class="splash-bill" id="splashBill" hidden>
            <p class="splash-when" id="splashWhen">Ce week-end</p>
            <ul id="splashPicks"></ul>
          </div>
          <button type="button" class="splash-btn" id="enterBtn">Ouvrir le programme</button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js?v=19"></script>
  </body>
</html>
